name: Pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels the checks still running for the previous one.
concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm lint

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm test:unit --run

  storybook:
    name: Storybook tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:ui --run

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    # Every run migrates the same Neon test branch, so runs from different pull requests take turns.
    concurrency:
      group: e2e
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium

      # Points the tests at the dedicated Neon test branch; never at the default branch.
      - name: Write .env.e2e
        env:
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.E2E_DATABASE_URL_UNPOOLED }}
          NEON_BRANCH: ${{ secrets.E2E_NEON_BRANCH }}
          NEON_AUTH_BASE_URL: ${{ secrets.E2E_NEON_AUTH_BASE_URL }}
          NEON_AUTH_JWKS_URL: ${{ secrets.E2E_NEON_AUTH_JWKS_URL }}
          NEON_AUTH_COOKIE_SECRET: ${{ secrets.E2E_NEON_AUTH_COOKIE_SECRET }}
        run: |
          for name in DATABASE_URL DATABASE_URL_UNPOOLED NEON_BRANCH NEON_AUTH_BASE_URL NEON_AUTH_JWKS_URL NEON_AUTH_COOKIE_SECRET; do
            printf '%s=%s\n' "$name" "${!name}"
          done > .env.e2e

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
